    <line x1="51" y1="120" x2="51" y2="125"/>
    <line x1="68" y1="119" x2="68" y2="126"/>
    <line x1="85" y1="120" x2="85" y2="125"/>
    <line x1="102" y1="120" x2="102" y2="125"/>
  </g>

  <!-- Text -->
  <text x="170" y="68" fill="#F1F5F9" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Smart PV Forecast</text>
  <text x="170" y="102" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="17">Solar Energy Prediction for Home Assistant</text>
