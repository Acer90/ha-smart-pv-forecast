      <stop stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0C0A2A"/>
    </linearGradient>
    <linearGradient id="sun_g" x1="52" y1="28" x2="84" y2="60" gradientUnits="userSpaceOnUse">
