    <line x1="68" y1="20" x2="68" y2="26"/>
    <line x1="68" y1="62" x2="68" y2="68"/>
    <line x1="44" y1="44" x2="50" y2="44"/>
    <line x1="86" y1="44" x2="92" y2="44"/>
    <line x1="51" y1="27" x2="55" y2="31"/>
    <line x1="81" y1="57" x2="85" y2="61"/>
    <line x1="85" y1="27" x2="81" y2="31"/>
    <line x1="55" y1="57" x2="51" y2="61"/>
  </g>

  <!-- Forecast curve -->
  <path d="M22 118 C28 118 32 110 38 101 C45 90 53 85 68 84 C83 85 91 90 98 101 C104 110 108 118 114 118 L114 122 L22 122 Z"
        fill="#38BDF8" fill-opacity="0.12"/>
  <path d="M22 118 C28 118 32 110 38 101 C45 90 53 85 68 84 C83 85 91 90 98 101 C104 110 108 118 114 118"
