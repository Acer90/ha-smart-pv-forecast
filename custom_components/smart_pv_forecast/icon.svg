<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0C0A2A"/>
    </linearGradient>
    <linearGradient id="sun_g" x1="35" y1="20" x2="61" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FEF08A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="48" cy="32" r="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="96" height="96" rx="20" fill="url(#bg)"/>

  <!-- Sun glow -->
  <circle cx="48" cy="32" r="20" fill="url(#glow)"/>

  <!-- Sun -->
  <circle cx="48" cy="32" r="11" fill="url(#sun_g)"/>

  <!-- Sun rays – 8 evenly spaced -->
  <g stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round">
    <line x1="48" y1="11" x2="48" y2="16"/>
    <line x1="48" y1="48" x2="48" y2="53"/>
    <line x1="27" y1="32" x2="32" y2="32"/>
    <line x1="64" y1="32" x2="69" y2="32"/>
    <line x1="33.5" y1="17.5" x2="37" y2="21"/>
    <line x1="59" y1="43" x2="62.5" y2="46.5"/>
    <line x1="62.5" y1="17.5" x2="59" y2="21"/>
    <line x1="37" y1="43" x2="33.5" y2="46.5"/>
  </g>

  <!-- PV forecast curve – bell shape (daily production profile) -->
  <!-- Filled area under curve -->
  <path d="M13 78 C18 78 22 72 28 65 C34 56 40 52 48 51 C56 52 62 56 68 65 C74 72 78 78 83 78 L83 82 L13 82 Z"
        fill="#38BDF8" fill-opacity="0.12"/>
  <!-- Curve line -->
  <path d="M13 78 C18 78 22 72 28 65 C34 56 40 52 48 51 C56 52 62 56 68 65 C74 72 78 78 83 78"
        stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Peak dot with inner highlight -->
  <circle cx="48" cy="51" r="3.5" fill="#0EA5E9"/>
  <circle cx="48" cy="51" r="1.5" fill="#BAE6FD"/>

  <!-- Baseline -->
  <line x1="11" y1="82" x2="85" y2="82" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Hour tick marks -->
  <g stroke="#4B5563" stroke-width="1.2" stroke-linecap="round">
    <line x1="20" y1="80" x2="20" y2="84"/>
    <line x1="34" y1="80" x2="34" y2="84"/>
    <line x1="48" y1="79" x2="48" y2="85"/>
    <line x1="62" y1="80" x2="62" y2="84"/>
    <line x1="76" y1="80" x2="76" y2="84"/>
  </g>
</svg>

